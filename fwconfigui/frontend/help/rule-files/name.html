<h2>Name</h2>
<p>The rule-file name (e.g. fw-rules.yaml).</p>
<p>While typing, the name is lowercased and characters other than letters, digits, <code>.</code>, <code>_</code>, and <code>-</code> are removed. Save stays disabled until the name is not empty. These names are the filenames offered when storing an fw-rule.</p>
